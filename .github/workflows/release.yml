name: Release

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master
    paths:
      - packages/vcopalette/package.json

permissions:
  contents: write

jobs:
  release:
    name: Publish vcopalette
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          cache: npm

      - name: Compare local and published version
        id: version
        run: |
          version=$(node -p "require('./packages/vcopalette/package.json').version")
          published=$(npm view vcopalette version 2>/dev/null || echo none)
          echo "version=$version" >> "$GITHUB_OUTPUT"
          if [ "$published" = "$version" ]; then
            echo "publish=false" >> "$GITHUB_OUTPUT"
            echo "vcopalette@$version is already published, skipping."
          else
            echo "publish=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Install dependencies
        if: steps.version.outputs.publish == 'true'
        run: npm ci

      - name: Type-check
        if: steps.version.outputs.publish == 'true'
        run: npm run typecheck -w vcopalette

      - name: Test
        if: steps.version.outputs.publish == 'true'
        run: npm test -w vcopalette

      - name: Build
        if: steps.version.outputs.publish == 'true'
        run: npm run build -w vcopalette

      - name: Publish to npm
        if: steps.version.outputs.publish == 'true'
        run: npm publish --access public -w vcopalette
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Create GitHub Release
        if: steps.version.outputs.publish == 'true'
        run: >-
          gh release create "v${{ steps.version.outputs.version }}"
          --target "$GITHUB_SHA"
          --title "v${{ steps.version.outputs.version }}"
          --generate-notes
        env:
          GH_TOKEN: ${{ github.token }}
